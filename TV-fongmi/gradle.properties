org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
org.gradle.caching=true
org.gradle.tooling.parallel=true
org.gradle.workers.max=2
# 沙箱总内存仅 6G：kotlin daemon 单独限堆，避免与 gradle daemon(3G) 叠加触发 OOM 杀进程
kotlin.daemon.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=384m
android.overridePathCheck=true
android.useAndroidX=true
