org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
org.gradle.caching=true
org.gradle.tooling.parallel=false
# 4G cgroup 硬限：Kotlin/R8 与 Gradle 守护进程堆互相制衡，避免叠加被 OOM 杀死
kotlin.daemon.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=320m
android.r8.maxWorkers=1
android.overridePathCheck=true
android.useAndroidX=true
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
