org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=448m -Dfile.encoding=UTF-8 --add-exports jdk.compiler/com.sun.tools.javac.code=ALL-UNNAMED
org.gradle.caching=true
org.gradle.tooling.parallel=true
org.gradle.workers.max=2
# 沙箱总内存仅 6G：android daemon 与 kotlin daemon 堆相互制衡，避免叠加 OOM 杀进程
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=448m
android.overridePathCheck=true
android.useAndroidX=true
systemProp.http.proxyHost=127.0.0.1
systemProp.http.proxyPort=18080
systemProp.https.proxyHost=127.0.0.1
systemProp.https.proxyPort=18080
systemProp.http.nonProxyHosts=localhost|127.0.0.1
systemProp.https.nonProxyHosts=localhost|127.0.0.1
