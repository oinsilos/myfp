name: Android Build

# 触发方式：推送到 main 自动构建；或 Actions 页面手动 Run workflow
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Grant gradlew permission
        run: chmod +x gradlew

      # 云端内存充足，release 混淆在全量构建时也不会 OOM；
      # 默认产出 mobile flavor 的 debug APK（无需签名，安装即用）
      - name: Build debug APK
        run: ./gradlew :app:assembleMobileDebug --max-workers=2 --console=plain

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-mobile-debug
          path: |
            app/build/outputs/apk/mobile/debug/*.apk
          retention-days: 14